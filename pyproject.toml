[project]
name = "claude-storm"
version = "0.2.0"
description = "Dual-agent brainstorming system using Claude Code CLI sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
]

[project.scripts]
storm = "claude_storm.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "textual-dev>=1.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*"              = ["D", "S101", "I002"]   # no docstrings, assert warnings, or required-imports in tests
"claude_storm/cli.py"  = ["UP007", "B008"]      # allow Optional[str] and typer.Option() defaults

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["claude_storm"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.sdist]
exclude = [".claude/", ".github/", ".tickets/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
