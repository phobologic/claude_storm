[project]
name = "claude-storm"
version = "0.1.0"
description = "Dual-agent brainstorming system using Claude Code CLI sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
]

[project.scripts]
storm = "claude_storm.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "textual-dev>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
